<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unity Editor Touch Bridge</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
        #canvas {
            display: block;
            width: 100vw;
            height: 100dvh;   /* dynamic viewport height — excludes browser chrome */
            touch-action: none;
        }
        #status {
            position: fixed; top: 8px; left: 8px;
            background: rgba(0,0,0,0.6); color: #fff;
            font-family: monospace; font-size: 12px;
            padding: 4px 8px; border-radius: 4px;
            pointer-events: none; z-index: 10;
            line-height: 1.6;
            white-space: pre;
        }
        #ip-form {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
            background: rgba(20,20,20,0.95); color: #fff; padding: 24px 32px;
            border-radius: 10px; text-align: center; font-family: sans-serif;
            z-index: 20;
        }
        #ip-form p { margin-bottom: 12px; font-size: 15px; }
        #ip-form input {
            padding: 8px 12px; width: 220px; font-size: 16px;
            border: 1px solid #555; border-radius: 4px;
            background: #222; color: #fff; margin-bottom: 12px;
            display: block; margin-left: auto; margin-right: auto;
        }
        #ip-form button {
            padding: 10px 28px; font-size: 15px; cursor: pointer;
            background: #1a6fff; color: #fff; border: none; border-radius: 5px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="status">Connecting…</div>
    <div id="ip-form" style="display:none">
        <p>Enter Unity Editor IP address</p>
        <input id="ip-input" type="text" placeholder="192.168.1.x" inputmode="url" />
        <button id="connect-btn">Connect</button>
    </div>

    <script>
    (function () {
        const canvas   = document.getElementById('canvas');
        const ctx      = canvas.getContext('2d');
        const statusEl = document.getElementById('status');
        const ipForm   = document.getElementById('ip-form');
        const ipInput  = document.getElementById('ip-input');

        let ws             = null;
        let reconnectTimer = null;
        let showDebug      = false;  // hidden until server sends cfg

        // ── Diagnostics ──────────────────────────────────────────────────────
        let rxFrameCount   = 0;
        let drawFrameCount = 0;
        let rxFps          = 0;
        let drawFps        = 0;
        let lastFpsTime    = Date.now();
        let lastFrameTs    = 0;   // timestamp of last video frame received
        let lastHbTs       = 0;   // timestamp of last heartbeat received
        let reconnectCount = 0;
        let decodeErrCount = 0;
        let totalRxFrames  = 0;
        let frameStallLogged = false;

        // Thresholds
        const STALL_WARN_MS    = 1500;  // warn in status bar
        const STALL_RECONN_MS  = 3000;  // force ws.close() → auto-reconnect

        function updateStatus(connected) {
            if (!showDebug) { statusEl.style.display = 'none'; return; }
            statusEl.style.display = 'block';
            const now   = Date.now();
            const ageMs = (connected && lastFrameTs > 0) ? now - lastFrameTs : -1;
            const hbAgeMs = (connected && lastHbTs > 0) ? now - lastHbTs : -1;
            const stall = (ageMs > STALL_WARN_MS) ? ' STALL' : '';
            const wsState = ws ? ['CONNECTING','OPEN','CLOSING','CLOSED'][ws.readyState] : 'NULL';
            statusEl.textContent =
                (connected ? '● ' : '○ ') +
                (connected ? `rx ${rxFps} fps  draw ${drawFps} fps` : 'Disconnected') +
                `\nage ${ageMs >= 0 ? ageMs + 'ms' : '--'}${stall}  hb ${hbAgeMs >= 0 ? hbAgeMs + 'ms' : '--'}` +
                `\ntotalRx ${totalRxFrames}  reconn ${reconnectCount}  decErr ${decodeErrCount}` +
                `\nws ${wsState}`;
        }

        // ── Per-second watchdog ───────────────────────────────────────────────
        setInterval(() => {
            const now = Date.now();
            const dt  = now - lastFpsTime;
            rxFps     = Math.round(rxFrameCount   * 1000 / dt);
            drawFps   = Math.round(drawFrameCount * 1000 / dt);
            rxFrameCount   = 0;
            drawFrameCount = 0;
            lastFpsTime    = now;

            const connected = ws && ws.readyState === WebSocket.OPEN;
            updateStatus(connected);

            if (connected && lastFrameTs > 0) {
                const ageMs = now - lastFrameTs;

                // Warn in console once
                if (ageMs > STALL_WARN_MS && !frameStallLogged) {
                    console.warn(`[MB][client] frame_stall ageMs=${ageMs} totalRx=${totalRxFrames} wsState=OPEN`);
                    frameStallLogged = true;
                }
                if (ageMs <= STALL_WARN_MS) {
                    frameStallLogged = false;
                }

                // Force reconnect — ws is alive (heartbeat recent) but video frames stopped
                if (ageMs > STALL_RECONN_MS) {
                    const hbAge = lastHbTs > 0 ? now - lastHbTs : -1;
                    console.warn(`[MB][client] stall_reconnect ageMs=${ageMs} hbAge=${hbAge} totalRx=${totalRxFrames}`);
                    // Close triggers onclose → automatic reconnect
                    ws.close(4001, 'stall_reconnect');
                }
            }
        }, 1000);

        // ── Canvas resize ────────────────────────────────────────────────────
        // Bitmap = CSS size × devicePixelRatio for crisp rendering on Retina/HiDPI.
        // CSS size is 100vw × 100dvh (dynamic viewport, excludes browser chrome).
        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width  = Math.round(rect.width  * dpr);
            canvas.height = Math.round(rect.height * dpr);
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ── Connection management ────────────────────────────────────────────
        function savedHost() {
            return localStorage.getItem('bridge_host') || null;
        }

        function startConnect(host) {
            if (!host) { ipForm.style.display = 'block'; return; }
            localStorage.setItem('bridge_host', host);
            ipForm.style.display = 'none';
            openWs(host);
        }

        function openWs(host) {
            if (ws) { ws.onclose = null; ws.close(); ws = null; }
            clearTimeout(reconnectTimer);
            lastFrameTs      = 0;
            lastHbTs         = 0;
            frameStallLogged = false;

            // Drain any pending decode so stale bitmap never draws after reconnect
            pendingBlob = null;

            statusEl.textContent = 'Connecting…';
            ws = new WebSocket(`ws://${host}:8765`);
            ws.binaryType = 'arraybuffer';

            const openTs = Date.now();

            ws.onopen = () => {
                reconnectCount++;
                console.log(`[MB][client] ws_open host=${host} reconnectCount=${reconnectCount} handshakeMs=${Date.now()-openTs}`);
                lastFrameTs = Date.now();
                lastHbTs    = Date.now();
                updateStatus(true);
                // Send hello so server can reply with directed cfg immediately
                ws.send(JSON.stringify({ type: 'hello' }));
                console.log('[MB][client] hello_sent');
            };

            ws.onclose = (e) => {
                console.warn(`[MB][client] ws_close code=${e.code} reason="${e.reason}" wasClean=${e.wasClean} totalRx=${totalRxFrames}`);
                updateStatus(false);
                reconnectTimer = setTimeout(() => openWs(host), 2000);
            };

            ws.onerror = () => {
                console.error(`[MB][client] ws_error totalRx=${totalRxFrames}`);
                updateStatus(false);
            };

            ws.onmessage = onMessage;
        }

        // ── Latest-frame-only decode pipeline ────────────────────────────────
        //
        // Problem: mobile browsers can queue many onmessage callbacks. If
        // createImageBitmap() takes longer than the inter-frame interval the
        // decode queue grows unboundedly, causing the rendered image to lag
        // further and further behind real-time (appears as "frame stall even
        // though ws.readyState===OPEN").
        //
        // Fix: keep only the newest blob. If a decode is already in-flight,
        // replace pendingBlob; when the in-flight decode finishes it draws
        // immediately and then starts decoding pendingBlob (if any) — always
        // showing the most recent frame, never accumulating a backlog.

        let pendingBlob  = null;   // newest unprocessed blob (may be replaced)
        let decoding     = false;  // true while createImageBitmap is in-flight

        function onMessage(e) {
            const recvTs = Date.now();
            rxFrameCount++;
            totalRxFrames++;

            // Text message: heartbeat or other JSON
            if (typeof e.data === 'string') {
                try {
                    const msg = JSON.parse(e.data);
                    if (msg.type === 'hb') {
                        lastHbTs = recvTs;
                    } else if (msg.type === 'cfg' && typeof msg.showDebug === 'boolean') {
                        console.log(`[MB][client] cfg_recv showDebug=${msg.showDebug}`);
                        showDebug = msg.showDebug;
                        updateStatus(ws && ws.readyState === WebSocket.OPEN);
                    }
                } catch (_) {}
                return;
            }

            // Binary message: JPEG frame
            lastFrameTs = recvTs;
            const blob  = new Blob([e.data], { type: 'image/jpeg' });

            if (decoding) {
                // Drop the previous pending frame, keep only the newest
                pendingBlob = blob;
                return;
            }

            decodeAndDraw(blob);
        }

        function decodeAndDraw(blob) {
            decoding = true;
            createImageBitmap(blob).then(bitmap => {
                requestAnimationFrame(() => {
                    const cw = canvas.width;
                    const ch = canvas.height;
                    lastBitmapW = bitmap.width;
                    lastBitmapH = bitmap.height;
                    const scale = Math.min(cw / bitmap.width, ch / bitmap.height);
                    const dw = bitmap.width  * scale;
                    const dh = bitmap.height * scale;
                    const dx = (cw - dw) / 2;
                    const dy = (ch - dh) / 2;
                    ctx.clearRect(0, 0, cw, ch);
                    ctx.drawImage(bitmap, dx, dy, dw, dh);
                    bitmap.close();
                    drawFrameCount++;
                });

                // Process the next pending frame immediately (if any)
                decoding = false;
                if (pendingBlob !== null) {
                    const next = pendingBlob;
                    pendingBlob = null;
                    decodeAndDraw(next);
                }
            }).catch(err => {
                decoding = false;
                decodeErrCount++;
                console.error(`[MB][client] decode_error #${decodeErrCount} totalRx=${totalRxFrames} err=${err.message}`);
                // Still try pending blob so pipeline doesn't permanently stall
                if (pendingBlob !== null) {
                    const next = pendingBlob;
                    pendingBlob = null;
                    decodeAndDraw(next);
                }
            });
        }

        // ── Letterbox helpers ────────────────────────────────────────────────
        // Track the last drawn frame's source dimensions so touch coordinates
        // can be mapped back into the original image space.
        let lastBitmapW = 0;
        let lastBitmapH = 0;

        function toNormalized(clientX, clientY) {
            // clientX/Y are CSS logical pixels; canvas.width/height are physical pixels.
            // Use getBoundingClientRect (CSS px) to stay in the same coordinate space.
            const rect = canvas.getBoundingClientRect();
            const cw = rect.width;
            const ch = rect.height;
            if (lastBitmapW === 0 || lastBitmapH === 0) {
                return { nx: (clientX - rect.left) / cw, ny: (clientY - rect.top) / ch };
            }
            // lastBitmapW/H are physical pixels; scale them to CSS px for comparison.
            const dpr = window.devicePixelRatio || 1;
            const srcW = lastBitmapW / dpr;
            const srcH = lastBitmapH / dpr;
            const scale = Math.min(cw / srcW, ch / srcH);
            const dw = srcW * scale;
            const dh = srcH * scale;
            const dx = rect.left + (cw - dw) / 2;
            const dy = rect.top  + (ch - dh) / 2;
            return {
                nx: Math.max(0, Math.min(1, (clientX - dx) / dw)),
                ny: Math.max(0, Math.min(1, (clientY - dy) / dh)),
            };
        }

        // ── Touch / Mouse input ──────────────────────────────────────────────
        function sendTouches(eventType, touches) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            ws.send(JSON.stringify({ type: 'touch', eventType: eventType, touches }));
        }

        function sendTouch(eventType, e) {
            e.preventDefault();
            const touches = Array.from(e.changedTouches).map(t => {
                const { nx, ny } = toNormalized(t.clientX, t.clientY);
                return { id: t.identifier, nx, ny };
            });
            sendTouches(eventType, touches);
        }

        function sendMouse(eventType, e) {
            const { nx, ny } = toNormalized(e.clientX, e.clientY);
            sendTouches(eventType, [{ id: 0, nx, ny }]);
        }

        canvas.addEventListener('touchstart',  e => sendTouch('began',     e), { passive: false });
        canvas.addEventListener('touchmove',   e => sendTouch('moved',     e), { passive: false });
        canvas.addEventListener('touchend',    e => sendTouch('ended',     e), { passive: false });
        canvas.addEventListener('touchcancel', e => sendTouch('cancelled', e), { passive: false });

        canvas.addEventListener('mousedown', e => sendMouse('began', e));
        canvas.addEventListener('mousemove', e => { if (e.buttons & 1) sendMouse('moved', e); });
        canvas.addEventListener('mouseup',   e => sendMouse('ended', e));

        document.getElementById('connect-btn').addEventListener('click', () => {
            const h = ipInput.value.trim();
            if (h) startConnect(h);
        });
        ipInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') { const h = ipInput.value.trim(); if (h) startConnect(h); }
        });

        // Auto-connect
        const autoHost = (location.hostname && location.hostname !== 'localhost')
            ? location.hostname
            : savedHost();
        startConnect(autoHost);
    })();
    </script>
</body>
</html>
